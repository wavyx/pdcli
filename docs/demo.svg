pacity="0"><animate attributeName="opacity" values="0;1" begin="6s" dur="0.01s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="11.8s" dur="0.01s" fill="freeze"/><animate attributeName="opacity" values="1;0;1" begin="7.6s" dur="0.8s" repeatCount="indefinite"/></rect><g opacity="0"><text x="26" y="148" class="ok">✓ Acme renewal → Won · activity logged</text><animate attributeName="opacity" values="0;1" begin="7.8s" dur="0.3s" fill="freeze"/><set attributeName="opacity" to="0" begin="12s"/></g><set attributeName="opacity" to="1" begin="6s"/><set attributeName="opacity" to="0" begin="12s"/></g>
