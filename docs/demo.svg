<g opacity="1"><clipPath id="type0"><rect x="26" y="70" height="36" width="0"><animate attributeName="width" begin="0s" dur="1.6s" from="0" to="210" fill="freeze" repeatCount="1"/><set attributeName="width" to="0" begin="6s"/></rect></clipPath><text x="26" y="96" class="prompt">❯ </text><text x="46" y="96" class="cmd" clip-path="url(#type0)">pdcli pipeline health</text><rect x="256" y="81" width="10" height="18" class="cur" opacity="0"><animate attributeName="opacity" values="0;1" begin="0s" dur="0.01s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="5.8s" dur="0.01s" fill="freeze"/><animate attributeName="opacity" values="1;0;1" begin="1.6s" dur="0.8s" repeatCount="indefinite"/></rect><g opacity="0"><text x="26" y="148" class="dim">┌ SALES PIPELINE ───────────────── Q2 ┐</text><text x="26" y="174" class="fg">Qualified     18 deals    €142,000</text><text x="26" y="200" class="fg">Contact       11 deals    € 98,500</text><text x="26" y="226" class="fg">Proposal       7 deals    € 76,200</text><text x="26" y="252" class="fg">Negotiation    4 deals    € 51,000</text><text x="26" y="278" class="dim">─────────────────────────────────────</text><text x="26" y="304" class="ok">weighted forecast          €221,480</text><text x="26" y="330" class="dim">win rate 32% · avg cycle 24d</text><animate attributeName="opacity" values="0;1" begin="1.8s" dur="0.3s" fill="freeze"/><set attributeName="opacity" to="0" begin="6s"/></g><set attributeName="opacity" to="0" begin="6s"/></g><g opacity="0"><clipPath id="type1"><rect x="26" y="70" height="36" width="0"><animate attributeName="width" begin="6s" dur="1.6s" from="0" to="350" fill="freeze" repeatCount="1"/><set attributeName="width" to="0" begin="12s"/></rect></clipPath><text x="26" y="96" class="prompt">❯ </text><text x="46" y="96" class="cmd" clip-path="url(#type1)">pdcli deal update 4821 --status won</text><rect x="396" y="81" width="10" height="18" class="cur" opacity="0"><animate attributeName="opacity" values="0;1" begin="6s" dur="0.01s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="11.8s" dur="0.01s" fill="freeze"/><animate attributeName="opacity" values="1;0;1" begin="7.6s" dur="0.8s" repeatCount="indefinite"/></rect><g opacity="0"><text x="26" y="148" class="ok">✓ Acme renewal → Won · activity logged</text><animate attributeName="opacity" values="0;1" begin="7.8s" dur="0.3s" fill="freeze"/><set attributeName="opacity" to="0" begin="12s"/></g><set attributeName="opacity" to="1" begin="6s"/><set attributeName="opacity" to="0" begin="12s"/></g><g opacity="0"><clipPath id="type2"><rect x="26" y="70" height="36" width="0"><animate attributeName="width" begin="12s" dur="1.6s" from="0" to="110" fill="freeze" repeatCount="1"/></rect></clipPath><text x="26" y="96" class="prompt">❯ </text><text x="46" y="96" class="cmd" clip-path="url(#type2)">pdcli audit</text><rect x="156" y="81" width="10" height="18" class="cur" opacity="0"><animate attributeName="opacity" values="0;1" begin="12s" dur="0.01s" fill="freeze"/><animate attributeName="opacity" values="1;0;1" begin="13.6s" dur="0.8s" repeatCount="indefinite"/></rect><g opacity="0"><text x="26" y="148" class="dim">┌ DATA HYGIENE ──────────── 11 checks ┐</text><text x="26" y="174" class="warn">● 3 duplicate deals</text><text x="26" y="200" class="warn">● 5 deals stale &gt; 30 days</text><text x="26" y="226" class="dim">○ 8 missing a next step</text><text x="26" y="252" class="dim">─────────────────────────────────────</text><text x="26" y="278" class="ok">3 must-fix · audit --strict gates CI</text><animate attributeName="opacity" values="0;1" begin="13.799999999999999s" dur="0.3s" fill="freeze"/></g><set attributeName="opacity" to="1" begin="12s"/></g>
