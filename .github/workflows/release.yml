name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC: npm trusted publishing + provenance (no NPM_TOKEN)
  packages: write # push the Docker image to GHCR

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm >= 11.5.1. Pin it, don't chase @latest:
      # newer npm builds have shipped a broken provenance bundle (publish dies
      # with "Cannot find module 'sigstore'"), and @latest also silently
      # dropped node-jq's install script (handled explicitly below).
      - run: npm install -g npm@11.5.1

      - run: npm ci

      # npm >= 11 (installed just above for trusted publishing) blocks
      # dependency lifecycle scripts, so node-jq's preinstall never fetches its
      # jq binary. Run its installer directly so --jq works in the test gate.
      - run: node node_modules/node-jq/scripts/install-binary.mjs

      # Gate the release on the same checks as CI.
      - run: npm run lint
      - run: npm run test:coverage

      # Auth is via OIDC trusted publishing (configure the trusted publisher
      # for this repo/workflow at npmjs.com first). Provenance is attached
      # automatically; no NPM_TOKEN secret is needed. Skips when this version
      # is already on npm (manual first publish, or a re-run of the tag).
      - name: Publish to npm (skip if already published)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # A prerelease (0.20.0-rc1) must NOT take the `latest` dist-tag, or
          # `npm i` and the Scoop checkver (which reads dist-tags.latest) serve
          # the RC. npm does not auto-detect prereleases, so pass --tag.
          case "$VERSION" in
            *-*) NPM_TAG=next ;;
            *)   NPM_TAG=latest ;;
          esac
          if npm view "@wavyx/pdcli@$VERSION" version >/dev/null 2>&1; then
            echo "@wavyx/pdcli@$VERSION already published — skipping"
          else
            npm publish --provenance --tag "$NPM_TAG"
          fi

      # Native tarballs for non-npm installs, attached to the GitHub Release.
      - name: Pack native tarballs
        run: npx oclif pack tarballs --targets linux-x64,linux-arm64,darwin-x64,darwin-arm64,win32-x64 --no-xz

      - name: Create GitHub Release from CHANGELOG (skip if exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md)
          # Mark prerelease tags so an RC does not become GitHub's "Latest".
          case "$VERSION" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          gh release create "$GITHUB_REF_NAME" $PRE \
            --title "$GITHUB_REF_NAME" \
            --notes "${NOTES:-Release $GITHUB_REF_NAME}" \
            dist/*.tar.gz

  docker:
    name: Publish Docker image
    needs: release # build from the just-published npm version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Single source of truth: read the version from the SAME package.json the
      # npm publish step used, so the Docker image installs a version that exists
      # on npm (deriving from the git tag can drift from package.json and 404).
      # Only stable releases get :latest — a prerelease (0.20.0-rc1) must not
      # poison the :latest tag that `docker pull` resolves by default.
      - name: Resolve version
        id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          case "$V" in
            *-*) echo "latest=" >> "$GITHUB_OUTPUT" ;; # prerelease: no :latest
            *) echo "latest=ghcr.io/${{ github.repository }}:latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/setup-qemu-action@v4 # cross-build arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: PDCLI_VERSION=${{ steps.ver.outputs.v }}
          # The :latest line is empty for prereleases (see Resolve version);
          # build-push-action ignores blank tag lines.
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.v }}
            ${{ steps.ver.outputs.latest }}

  dist:
    name: Publish Homebrew + Scoop
    needs: release # regenerate from the just-published npm tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Regenerate the formula + manifest from the published tarball (sha256).
      - name: Generate dist files
        id: gen
        run: |
          V=$(node -p "require('./package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          node scripts/gen-dist.mjs "$V"

      # Cross-repo push needs a PAT (the default GITHUB_TOKEN is scoped to this
      # repo). Add a fine-grained TAP_TOKEN secret with contents:write on
      # wavyx/homebrew-tap and wavyx/scoop-pdcli to enable auto-publish; without
      # it this step no-ops so the release never fails on a missing secret.
      # Prereleases are skipped (they must not move the stable formula/manifest).
      - name: Push to tap repos
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          V: ${{ steps.gen.outputs.v }}
        run: |
          case "$V" in *-*) echo "prerelease $V — skipping tap publish"; exit 0 ;; esac
          if [ -z "$TAP_TOKEN" ]; then
            echo "No TAP_TOKEN secret — skipping Homebrew/Scoop publish."
            echo "Run 'node scripts/gen-dist.mjs $V' and push manually, or add the PAT."
            exit 0
          fi
          git config --global user.name "pdcli-release"
          git config --global user.email "release@wavyx.dev"
          push_file() {
            repo="$1"; src="$2"; dest="$3"
            tmp=$(mktemp -d)
            git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${repo}.git" "$tmp"
            mkdir -p "$(dirname "$tmp/$dest")"
            cp "$src" "$tmp/$dest"
            git -C "$tmp" add "$dest"
            git -C "$tmp" commit -m "pdcli $V" || { echo "no change for $repo"; return 0; }
            git -C "$tmp" push
          }
          push_file wavyx/homebrew-tap packaging/homebrew/pdcli.rb Formula/pdcli.rb
          push_file wavyx/scoop-pdcli   packaging/scoop/pdcli.json  bucket/pdcli.json
